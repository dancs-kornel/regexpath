spring.application.name=server

lessons.path=classpath:lessons/

logging.level.hu.kornel.server=DEBUG
logging.level.org.springframework.context=DEBUG

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/regex_xpath_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:regexpath_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG

# JWT Configuration
# Secret key for signing JWT tokens (256-bit minimum for HS256)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Token expiration in milliseconds (86400000 = 24 hours)
jwt.refresh-expiration=604800000
# Refresh token expiration (604800000 = 7 days)

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
