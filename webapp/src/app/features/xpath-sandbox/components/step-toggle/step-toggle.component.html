<button (click)="toggleMode.emit()" class="step-toggle-btn" [class.on]="enabled" [class.off]="!enabled"
    title="Toggle step-by-step evaluation">
    <span class="icon" *ngIf="!enabled">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <polygon points="9 7 20 12 9 17 9 7"></polygon>
        </svg>
    </span>

    <span class="icon" *ngIf="enabled">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
    </span>

    <span class="label">
        Részletes kiértékelés:
        <strong>{{ enabled ? 'BE' : 'KI' }}</strong>
    </span>
</button>
