<div class="xpath-sandbox sandbox-page">
  <h1>XPath Sandbox</h1>

  <div class="sandbox-top-card">
    <div class="sandbox-top-left">
      <div class="section-heading-row">
        <label class="input-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <span class="section-heading-text">XPath kifejezés:</span>
        </label>
      </div>

      <app-xpath-input [expression]="xpathExpression" [loading]="loading" [tokens]="commonTokens"
        (expressionChange)="onXpathExpressionChange($event)" (evaluate)="onEvaluate()">

        <app-step-toggle [enabled]="stepByStepEnabled" (toggleMode)="toggleStepByStepMode()">
        </app-step-toggle>

      </app-xpath-input>
    </div>

    <div class="sandbox-top-right">
      <div class="section-heading-row">
        <span class="section-heading-text">Példa kiválasztása:</span>
      </div>

      <app-example-manager [samples]="samples" [selectedSample]="selectedSample" [isAuthenticated]="isAuthenticated()"
        [uploadAccept]="'.html,.xml,.xhtml'" [currentText]="editableSource" [hasUnsavedChanges]="hasUnsavedChanges"
        [contentTypes]="[ContentType.HTML, ContentType.XML]" (sampleSelected)="selectSample($event)"
        (contentLoaded)="onExampleManagerContentLoaded($event)" (fileSelected)="handleFileSelected($event)">
      </app-example-manager>
    </div>
  </div>
  <div class="loaded-content-bar" *ngIf="currentContent">
    <span class="loaded-name">{{ currentContent.name }}</span>
    <span class="source-badge" [class.builtin]="currentContent.source === 'BUILTIN'">
      {{ currentContent.source === 'BUILTIN' ? 'Beépített' : 'Saját' }}
    </span>
    <span class="loaded-desc" *ngIf="currentContent.description">
      — {{ currentContent.description }}
    </span>

    <span *ngIf="hasUnsavedChanges" class="unsaved-indicator">
      • Nem mentett változtatások
    </span>
  </div>
  <app-step-toolbar *ngIf="stepByStepEnabled" class="sandbox-toolbar-row" [enabled]="stepByStepEnabled"
    [state]="currentPlaybackState" [isFirstStep]="isFirstStep" [isLastStep]="isLastStep"
    [currentStepIndex]="currentStepIndex" [totalSteps]="totalSteps" [isPlaying]="isPlaying"
    [playbackSpeed]="playbackSpeed" [speedMultiplier]="speedMultiplier"
    [currentStepDescription]="currentStepDescription" [currentStepMatches]="currentStepMatches"
    (previous)="previousStep()" (next)="nextStep()" (playPause)="togglePlayPause()" (reset)="resetSteps()"
    (onSpeedChangeEvent)="onSpeedChange($event)">
  </app-step-toolbar>
 

  <app-document-workspace #documentWorkspaceRef [initialText]="editableSource" [currentContent]="currentContent"
    (documentUpdated)="onWorkspaceDocumentUpdated()" (dirtyStateChange)="onWorkspaceDirtyChange($event)"
    (renderAvailabilityChange)="onRenderedAvailChange($event)" (textChanged)="onWorkspaceTextChanged($event)">
  </app-document-workspace>

  <app-results-list [result]="evaluationResult" (resultHover)="onResultHover($event)"
    (resultClick)="onResultClick($event)">
  </app-results-list>

  <app-xpath-explanation [xpathExpression]="xpathExpression">
  </app-xpath-explanation>

  <div *ngIf="loading" class="loading-state">
    <p>Betöltés...</p>
  </div>
</div>
