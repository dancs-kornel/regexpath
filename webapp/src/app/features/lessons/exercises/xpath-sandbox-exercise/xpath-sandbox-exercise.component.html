<div class="xpath-sandbox-container flex-column">
  <!-- XPath Input Section -->
  <div class="xpath-input-section flex-column">
    <label class="input-label">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m18 16 4-4-4-4" />
        <path d="m6 8-4 4 4 4" />
        <path d="m14.5 4-5 16" />
      </svg>
      XPath Kifejezés
    </label>
    
    <div class="input-wrapper">
      <input
        id="xpath-expression"
        type="text"
        class="xpath-input"
        [(ngModel)]="xpathExpression"
        (ngModelChange)="onXPathChange()"
        [disabled]="(submitted && !assignmentMode) || previewMode"
        placeholder="Enter XPath expression (e.g., //li)"
        spellcheck="false"
        autocomplete="off" />
    </div>
    
    <!-- Syntax Error Display -->
    <div class="syntax-error" *ngIf="syntaxError && !submitted">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      {{ syntaxError }}
    </div>
  </div>

  <!-- Sample Document Display -->
  <div class="document-section flex-column">
    <div class="document-header flex-between">
      <h4>Mintadokumentum</h4>
      <div class="loading-overlay" *ngIf="loading">
        <span class="spinner"></span>
        <span class="loading-text">Hitelesítés...</span>
      </div>
    </div>
    
    <div class="document-wrapper">
      <pre class="sample-document"><code #codeDisplay class="language-markup font-monospace"></code></pre>
    </div>
  </div>

  <!-- Results Section (shown after submission in lesson mode only) -->
  <div class="results-section" *ngIf="submitted && result && !assignmentMode">
    <div class="result-card" [class.correct]="result.correct" [class.incorrect]="!result.correct">
      <div class="result-header">
        <div class="result-icon">
          <svg *ngIf="result.correct" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <svg *ngIf="!result.correct" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        </div>
        <div class="result-content">
          <h4>{{ result.message }}</h4>
          <p *ngIf="result.explanation">{{ result.explanation }}</p>
        </div>
      </div>
      
      <!-- Node Comparison -->
      <div class="node-comparison" *ngIf="result.expectedNodes || result.actualNodes">
        <div class="comparison-stats">
          <div class="stat-item flex-column">
            <span class="stat-label">Várt csomópontok:</span>
            <span class="stat-value">{{ result.expectedNodes?.length || 0 }}</span>
          </div>
          <div class="stat-item flex-column">
            <span class="stat-label">Választott csomópontok:</span>
            <span class="stat-value">{{ result.actualNodes?.length || 0 }}</span>
          </div>
        </div>

        <!-- Show node paths if incorrect -->
        <div class="node-details flex-column" *ngIf="!result.correct">
          <details class="node-disclosure" *ngIf="result.expectedNodes?.length > 0">
            <summary>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              Várt csomópont útvonalak
            </summary>
            <ul class="node-list">
              <li class="font-monospace" *ngFor="let node of result.expectedNodes">{{ node }}</li>
            </ul>
          </details>

          <details class="node-disclosure" *ngIf="result.actualNodes?.length > 0">
            <summary>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              Választott csomópontok
            </summary>
            <ul class="node-list">
              <li class="font-monospace" *ngFor="let node of result.actualNodes">{{ node }}</li>
            </ul>
          </details>
        </div>
      </div>
    </div>
  </div>
</div>
