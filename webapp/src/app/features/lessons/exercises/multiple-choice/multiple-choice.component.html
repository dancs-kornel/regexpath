<div class="multiple-choice-container">
  <p class="instruction-text">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l3 3L22 4"></path>
      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
    </svg>
    Válaszd ki az összes helyes választ
  </p>

  <div class="options-list">
    @for (option of exercise?.options; track option.id) {
      <label
        class="option-item"
        [class.selected]="isSelected(option.id)"
        [class.disabled]="submitted || previewMode"
        [class.correct]="isUserCorrectSelection(option.id) || isUnselectedCorrectAnswer(option.id)"
        [class.incorrect]="isIncorrectSelection(option.id)">

        <input
          type="checkbox"
          [value]="option.id"
          [checked]="isSelected(option.id)"
          [disabled]="submitted || previewMode"
          (change)="onCheckboxChange(option.id, $event)"
          class="option-checkbox" />

        <div class="checkbox-custom checkbox-custom-md">
          <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <span class="option-text">{{ option.text }}</span>

        @if (submitted) {
          @if (isUserCorrectSelection(option.id) || isUnselectedCorrectAnswer(option.id)) {
            <svg class="status-icon correct-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          } @else if (isIncorrectSelection(option.id)) {
            <svg class="status-icon incorrect-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          }
        }
      </label>
    }
  </div>
</div>
