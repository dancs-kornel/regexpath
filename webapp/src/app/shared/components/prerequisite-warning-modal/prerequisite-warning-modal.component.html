<div class="modal-overlay modal-backdrop" (click)="onClose()">
  <div class="modal-content modal flex-column" (click)="$event.stopPropagation()">
    <div class="modal-header flex-between border-bottom">
      <h2>Előfeltételek</h2>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <div class="modal-body">
      <p class="modal-message">
        A(z) <strong>{{ lessonTitle }}</strong> lecke megkezdése előtt javasolt befejezni az alábbi leckéket:
      </p>

      <div class="prerequisites-list flex-column">
        <div
          *ngFor="let prereq of prerequisites"
          class="prerequisite-item card-hover-subtle"
        >
          <div class="prereq-info flex-column">
            <h3>{{ prereq.title }}</h3>
            <p>{{ prereq.description }}</p>
          </div>

          <button
            class="btn-secondary btn-small btn-goto"
            (click)="goToPrerequisite(prereq.lessonId)"
          >
            Ugrás a leckéhez →
          </button>
        </div>
      </div>

      <p class="disclaimer">
        Folytathatod anélkül is, de az előfeltételek ismerete segíthet a lecke megértésében.
      </p>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()">Mégse</button>
      <button class="btn-primary" (click)="onContinueAnyway()">Folytatom így is</button>
    </div>
  </div>
</div>
