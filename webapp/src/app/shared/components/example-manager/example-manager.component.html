
<div class="example-manager content-management card-surface">

  <div class="content-select-row selector-group">

    <select
      id="content-select"
      class="example-select"
      [value]="selectedOptionValue()"
      (change)="onSelectChange($event)"
      [disabled]="isLoadingContent">

      <option value="">-- Új / Üres --</option>

      <optgroup
        label="Built-in Examples"
        *ngIf="builtinExamples.length > 0">
        <option
          *ngFor="let example of builtinExamples"
          [value]="example.id">
          {{ example.name }} ({{ example.contentLength }} karakter)
        </option>
      </optgroup>

      <optgroup
        label="My Content"
        *ngIf="userContents.length > 0 && isAuthenticatedNow()">
        <option
          *ngFor="let content of userContents"
          [value]="content.id">
          {{ content.name }} ({{ content.contentLength }} karakter)
        </option>
      </optgroup>

      <optgroup
        label="Frontend Samples"
        *ngIf="samples.length > 0">
        <option
          *ngFor="let sample of samples; let i = index"
          [value]="'sample-' + i">
          {{ sample.name }} ({{ sample.type?.toUpperCase?.() || sample.type }})
        </option>
      </optgroup>
    </select>

    <span *ngIf="isLoadingContent" class="loading-spinner"></span>
  </div>

  <div class="action-buttons">
    <button
      class="btn-utility upload-btn"
      (click)="triggerFileUpload()"
      [disabled]="isUploading || !isAuthenticatedNow()"
      [title]="isAuthenticatedNow() ? 'Fájl feltöltése' : 'Jelentkezz be a fájlok feltöltéséhez'">
      <span class="btn-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h5l2 3h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
          <path d="M12 10v6"></path>
          <path d="M9 13l3-3 3 3"></path>
        </svg>
      </span>
      <span class="btn-text">
        {{ isUploading ? 'Feltöltés...' : 'Fájl feltöltése' }}
      </span>
    </button>

    <button
      class="btn-utility save-btn"
      [disabled]="isSaving || !canSaveForLater"
      (click)="onSaveClicked()"
      [title]="currentContent?.source === ContentSource.BUILTIN
                ? 'Mentsd el sajátként ezt a példát'
                : 'Változtatások mentése'">
      <span class="btn-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </span>
      <span class="btn-text">
        {{ isSaving
            ? 'Mentés...'
            : (currentContent?.source === ContentSource.BUILTIN ? 'Mentés sajátként' : 'Mentés') }}
      </span>
    </button>

    <button
      class="btn-utility delete-btn"
      [disabled]="!canDelete"
      (click)="onDeleteClicked()"
      title="Tartalom törlése">
      <span class="btn-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </span>
      <span class="btn-text">Törlés</span>
    </button>
  </div>

  <input
    #fileInput
    type="file"
    [attr.accept]="uploadAccept"
    (change)="onFileInputChange($event)"
    style="display: none;">

  <div *ngIf="contentError" class="content-error mt-2">
    {{ contentError }}
  </div>
</div>
